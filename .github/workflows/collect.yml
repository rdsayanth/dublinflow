name: Collect Dublin Bikes data

on:
  workflow_dispatch:        # adds a "Run workflow" button on GitHub

jobs:
  collect:
    runs-on: ubuntu-latest  # a fresh Linux machine for each run
    steps:
      - uses: actions/checkout@v5          # copy your repo onto the machine
      - uses: actions/setup-python@v6      # install Python
        with:
          python-version: "3.12"
          cache: pip                       # reuse downloaded packages between runs
      - run: pip install -r requirements.txt
      - run: python ingestion/collect_gbfs.py
        env:
          AZURE_RAW_CONTAINER_SAS_URL: ${{ secrets.AZURE_RAW_CONTAINER_SAS_URL }}